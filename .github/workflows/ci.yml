name: CI

# Every pull request, whatever it targets - the branches in this repo are
# stacked, so a PR based on another PR needs checking just as much as one
# based on main.
on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Matches the JDK this is developed against. AGP and Gradle are both
          # fussy about this, and an older one here would find problems that
          # nobody has locally, or miss ones everybody does.
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Deliberately not assembleRelease: signing credentials live outside the
      # repo and the build is meant to fail loudly without them. Nothing here
      # needs a signed artifact to know whether the code is sound.
      - name: Build, test and lint
        run: ./gradlew test lintDebug assembleDebug --no-daemon

      # Always, including when the build failed: a green run is no evidence
      # that any test ran, since Gradle's test task prints nothing on success.
      # A suite reduced to zero tests passes exactly as loudly as one that
      # works, and this is what tells the two apart.
      - name: Summarise tests
        if: always()
        run: python3 scripts/ci/summarise-tests.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: app/build/test-results/
          retention-days: 7

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-reports
          path: app/build/reports/
          retention-days: 7
